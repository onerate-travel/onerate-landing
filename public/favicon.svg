<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OneRate">
  <!-- The third surface, and the ring is what all three share. The agency portal is `--teal` on a
       dark disc and the admin panel is `--teal-on-ink` on `--ink`; this one inverts them — the
       brand drawn ON paper, because onerate.travel is the outward face and a visitor who has both
       a portal tab and this one open needs to tell them apart at 16px. That is the only size that
       matters here.

       The O is a RING and not a glyph, the same reason the other two give: a favicon renders
       outside the page, so none of the webfonts this page loads are available to it.

       Both values are `@onerate/ui` tokens read from the LIGHT palette — `--paper` #f7f6f2 and
       `--teal` #0e6b5c, 5.9:1 against each other. A favicon has no theme of its own; the browser
       chrome it sits in has one, and a light plate reads on either. `test/design.test.js` pins
       both against the design system. -->
  <rect width="64" height="64" rx="14" fill="#f7f6f2"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#0e6b5c" stroke-width="7"/>
</svg>
